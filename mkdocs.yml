site_name: UCD Physics Labs

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  
nav:
  - Home: index.md
  - Information: 
    - Beech Hill: information/beech_hill.md
    - Stage 3: information/stage_3.md
    - Stage 4: information/stage_4.md
    - Dignity and Respect: information/d_and_r.md
  - Documentation:
    - Python:
      - Python Overview: documentation/python/python_overview.md
      - Get Python: documentation/python/get_python.md
      - Python Resources: documentation/python/python_resources.md
      - Coding Guidelines: documentation/python/coding_guidelines.md
      - Python How Tos: documentation/python/python_how_tos.md
    - DACQ:
        - DACQ Main Page: documentation/dacQ/dacQ_main.md
        - Data Aquisition Hints and Tips: documentation/dacQ/data_aq_tips.md
        - DACQ General Concepts: documentation/dacQ/dacq_concepts.md
        - NI USB-6008/6009: documentation/dacQ/ni_usb_6000.md
        - IEEE-488: documentation/dacQ/ieee-488.md
        - RBD 9103 Picoammeter: documentation/dacQ/rbd_1903.md
        - Fresnel Diffraction using Ultrasound: documentation/dacQ/fresnel.md
        - Teensy Pulse Generator: documentation/dacQ/teensy.md
    - Data Analysis: documentation/data_analysis.md
    - Report Writing: documentation/report_writing.md

  
theme:
    name: material
    logo: imgs/UCD_logo_transparency.png
    favicon: imgs/UCD_logo_transparency_favicon.png
    features:
      - content.code.copy